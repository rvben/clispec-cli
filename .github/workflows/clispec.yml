name: CLI health

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '3 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: clispec v0.3
    uses: rvben/clispec/.github/workflows/conformance.yml@3b33360d9d55ae419449b4897e79d55049ec5705
    with:
      binary: target/debug/clispec
      self-score: true

  published-artifacts:
    name: Published artifacts
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: rvben/clispec/.github/workflows/published-artifacts.yml@3b33360d9d55ae419449b4897e79d55049ec5705
    with:
      crates: clispec
      pypi: clispec
      homebrew-formula: clispec
